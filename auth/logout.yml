info:
  name: logout
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 204) {
          bru.setEnvVar("accessToken", ""); // set empty sting
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
