info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/register"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 201 Created", function() {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
