info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/login"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // save the access token so protected requests can use {{accessToken}}
        if (res.status === 200 && res.body.access_token) {
          bru.setEnvVar("accessToken", res.body.access_token);
        }

        // save the refresh_token cookie so we can test refresh token
        const setCookie = res.headers["set-cookie"];
        const cookies = Array.isArray(setCookie) ? setCookie : setCookie ? [setCookie] : [];
        const refresh = cookies
          .map((c) => c.split(";")[0])
          .find((c) => c.startsWith("refresh_token="));
        if (refresh) {
          bru.setEnvVar("refreshToken", refresh.slice("refresh_token=".length));
        }
    - type: tests
      code: |-
        test("returns 200 OK", function() {
          expect(res.status).to.equal(200);
        });
        test("returns an access token", function() {
          expect(res.body.access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
