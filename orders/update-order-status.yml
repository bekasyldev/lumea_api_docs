info:
  name: update order status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/orders/{{orderId}}/status"
  body:
    type: json
    data: |-
      {
        "Status": "confirmed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
